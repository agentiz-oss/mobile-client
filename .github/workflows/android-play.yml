name: Build and Deploy Android to Google Play

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the bundle to Google Play (off = build and keep the artifact only)'
        required: false
        type: boolean
        default: true
      track:
        description: 'Play track to publish to'
        required: false
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build, Sign and Deploy to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          MISSING=""
          for NAME in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
                      ANDROID_KEY_PASSWORD GOOGLE_SERVICES_JSON_BASE64 PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!NAME:-}" ]; then
              MISSING="$MISSING $NAME"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "Missing repository secrets:$MISSING" >&2
            echo "See .github/workflows/README-android-play.md for how to create them." >&2
            exit 1
          fi
          echo "All required secrets are present."

      # Per-deployment Firebase config, gitignored and therefore absent from the checkout. Without
      # it the Google Services plugin is not applied at all (see composeApp/build.gradle.kts) and
      # the build silently produces an app that can never receive a push.
      - name: Install google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > composeApp/google-services.json
          # A truncated or wrongly-encoded secret is much easier to diagnose here than as a build
          # failure inside the Google Services plugin.
          python3 -c 'import json,sys; json.load(open("composeApp/google-services.json"))'
          PKG=$(python3 -c 'import json; d=json.load(open("composeApp/google-services.json")); print(" ".join(c["client_info"]["android_client_info"]["package_name"] for c in d["client"]))')
          echo "Firebase clients in this config: $PKG"
          case " $PKG " in
            *" cx.m42.agentiz "*) ;;
            *) echo "google-services.json has no client for cx.m42.agentiz — push would be inert." >&2; exit 1 ;;
          esac

      # The upload key. Written into RUNNER_TEMP, never into the workspace, so it cannot be picked
      # up by an artifact upload or left behind in a cached directory.
      - name: Install upload keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Only pushes to main refresh the shared cache entry; other runs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Verify the keystore holds the alias the build will ask for
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
        run: |
          set -euo pipefail
          # Gradle's own failure for a wrong password or a missing alias arrives deep inside a
          # signing task and names neither; keytool says which of the two it is.
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" \
                  -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "Keystore contains alias $ANDROID_KEY_ALIAS."

      # Play refuses a versionCode it has already accepted. run_number only ever grows within a
      # repository, including across re-runs of older commits, so it can never collide with another
      # CI build. The 1000 offset keeps it from colliding with a *hand-made* one either: codes below
      # 1000 belong to bundles built on a laptop, and the very first release of this app had to be
      # uploaded that way because the Play API cannot create it.
      #
      # The sum is computed by the shell and not in a `${{ }}` expression: GitHub's expression
      # language has no arithmetic operators at all, and a workflow containing one is rejected when
      # it is *dispatched* — the file parses as YAML and fails only at the API, saying
      # "Unexpected symbol: '+'".
      - name: Choose the versionCode
        run: echo "ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      - name: Build the release bundle
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :composeApp:bundleRelease --stacktrace

      # An APK as well, for installing on a phone directly — a Play bundle cannot be sideloaded.
      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :composeApp:assembleRelease --stacktrace

      - name: Confirm the bundle is signed
        run: |
          set -euo pipefail
          APK=$(ls composeApp/build/outputs/apk/release/*.apk | head -1)
          # An unsigned artifact is what this build produced before the signing config existed, and
          # Play rejects it with a message that does not mention signing at all.
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_number }}
          path: |
            composeApp/build/outputs/bundle/release/*.aab
            composeApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Google Play
        if: github.event_name == 'push' || inputs.upload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: cx.m42.agentiz
          releaseFiles: composeApp/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
          releaseName: ${{ github.run_number }} (${{ github.sha }})
