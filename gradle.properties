org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official

# Reuse the Kotlin compiler daemon and let incremental compilation work across
# builds; Kotlin/Native needs its own heap since it runs out-of-process.
kotlin.incremental=true
kotlin.incremental.native=true
kotlin.daemon.jvmargs=-Xmx3g

# kotlin.native.cacheKind.iosArm64 is deliberately unset. Setting it to "static"
# makes Kotlin/Native build per-dependency static caches, which pays off on
# repeated debug builds but not here: release linking largely bypasses them, and
# on CI the caches are built from scratch every job against a cold ~/.konan.
# Revisit only with a measured before/after — see the timings in the job log.

android.useAndroidX=true
android.nonTransitiveRClass=true
